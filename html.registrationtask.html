<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Form</title>
    <style>
        body {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <h1>Employee Registration Form</h1>

    <form>
        <p>
            <label>Employee Name:</label><br>
            <input type="text" name="employeeName" placeholder="Enter your name">
        </p>

        <p>
            <label>Password:</label><br>
            <input type="password" name="password">
        </p>

        <p>
            <label>Email:</label><br>
            <input type="email" name="email">
        </p>

        <p>
            <label>Mobile Number:</label><br>
            <input type="text" name="mobile">
        </p>

        <p>
            <label>Age:</label><br>
            <input type="number" name="age">
        </p>

        <p>
            <label>Date of Birth:</label><br>
            <input type="text" name="dob" placeholder="dd-mm-yyyy">
        </p>

        <p>
            <label>Preferred Interview Time:</label><br>
            <input type="time" name="interviewTime">
        </p>

        <p>
            <label>Gender:</label><br>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </p>

        <p>
            <label>Skills:</label><br>
            <input type="checkbox" name="skills" value="HTML"> HTML
            <input type="checkbox" name="skills" value="CSS"> CSS
            <input type="checkbox" name="skills" value="JavaScript"> JavaScript
        </p>

        <p>
            <label>Select Department:</label><br>
            <select name="department">
                <option>Select Department</option>
                <option>CSE</option>
                <option>IT</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>MECH</option>
                <option>CIVIL</option>
            </select>
        </p>

        <p>
            <label>Upload Resume:</label><br>
            <input type="file" name="resume">
        </p>

        <p>
            <label>Address:</label><br>
            <textarea name="address" rows="3" cols="30" placeholder="Enter your address"></textarea>
        </p>

        <!-- Work Experience with RANGE SLIDER -->
        <p>
            <label>Work Experience (years):</label><br>
            <input type="range" name="experience" min="0" max="20" value="0" step="1"
    oninput="showExperience(this.value)">
            <span id="expValue">0</span> years
        </p>

        <p>
            <label>LinkedIn Profile:</label><br>
            <input type="text" name="linkedin" placeholder="Enter LinkedIn URL">
        </p>

        <p>
            <input type="submit" value="Register">
            <input type="reset" value="Reset">
        </p>
    </form>

    <script>
        function showExperience(value) {
            document.getElementById("expValue").innerText = value;
        }
    </script>

</body>
</html>
